services:
  tshopper:
    image: mpholley/tshopper:latest
    container_name: tshopper
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=tshopper
    ports:
      - '6000:3000'
    environment:
      - ORIGIN=https://tshopper.example.com
      - DATABASE_URL=http://libsql:8080
      - APP_PASSWORD=abc123
      - SESSION_SECRET=MySecretKeyWithEnoughCharacters
      - OPENROUTER_API_KEY=your-api-key
      - OPENROUTER_MODEL=openai/gpt-5.6-luna
    depends_on:
      libsql:
        condition: service_healthy
    restart: always

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: tshopper-db
    volumes:
      - libsql-data:/var/lib/sqld
    restart: always
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  watchtower:
    image: nickfedor/watchtower
    container_name: tshopper-watchtower
    labels:
      - com.centurylinklabs.watchtower.scope=tshopper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 * * * *
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=tshopper
    restart: unless-stopped

volumes:
  libsql-data:
